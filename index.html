<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RingCentral SMS</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#0078D4;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    width:100%;
}

#resultado{
    margin-top:15px;
}
</style>

</head>
<body>

<h2>Enviar SMS</h2>

<input type="text" id="to" placeholder="+521XXXXXXXXXX">

<textarea id="text" rows="5" placeholder="Escribe tu mensaje"></textarea>

<button onclick="enviarSMS()">
Enviar SMS
</button>

<div id="resultado"></div>

<script>

async function enviarSMS() {

  document.getElementById("resultado").innerHTML = "Enviando...";

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbxMAQq9Wjc9yNHhZdG0rOE1gXvm_vMybzo4Bg1_nPsXPm6pOIVSNCx3mZMBu14roIsO/exec",
    {
      method: "POST",
      headers: {
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        to: document.getElementById("to").value,
        text: document.getElementById("text").value
      })
    }
  );

  document.getElementById("resultado").innerHTML =
  "✅ SMS enviado";

}

</script>

</body>
</html>
